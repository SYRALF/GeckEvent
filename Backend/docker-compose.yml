version: '3.9' 

services:
  nest-app:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: geckevent_backend
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:15-alpine
    container_name: geckevent_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
volumes:
  postgres_data: