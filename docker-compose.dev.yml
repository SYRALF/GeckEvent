services:

  postgres:
    image: postgres:15-alpine
    container_name: geckevents_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: geckevent_user
      POSTGRES_PASSWORD: geckevent_pass
      POSTGRES_DB: geckevent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geckevent_user -d geckevent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
    driver: local