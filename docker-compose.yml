version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: geckevents_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geckevent_user
      POSTGRES_PASSWORD: geckevent_pass
      POSTGRES_DB: geckevent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geckevent_user -d geckevent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: geckevent_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://geckevent_user:geckevent_pass@postgres:5432/geckevent_db
      JWT_SECRET: supersecretjwt2026local
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: geckevent_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local